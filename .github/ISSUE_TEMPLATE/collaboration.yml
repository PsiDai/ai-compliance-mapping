name: Idea or correction
description: Suggest a control, framework, correction or use case.
labels: ["idea"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see added or corrected?
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework and clause (if relevant)
      placeholder: e.g. ISO/IEC 42001 clause 6.1
  - type: markdown
    attributes:
      value: Please do not include confidential or client information.
